name: Build, Test and Deploy a .NET Core WebApi to Azure App Service

env: # Change these settings if you like
  ARTIFACT_NAME: WebApi
  DOTNET_CORE_VERSION: 10.0.x
  PUBLISH_DIRECTORY: "./out/publish"
on:
#  Uncomment the following lines to enable automatic deployment on push to main, deployment, or master branches
#  push:
#    branches:
#      - main
#      - deployment
#      - master 

  # Allows you to run this workflow manually from the Actions tab.
  workflow_dispatch:

jobs:
  check: # checking if the secrets exist (src: https://stackoverflow.com/questions/72925899/github-actions-detect-if-secret-exists)
      runs-on: ubuntu-latest
      steps:
        - name: "Check if AZURE_WEBAPP_NAME secret exists"
          env: 
            super_secret: ${{ secrets.AZURE_WEBAPP_NAME }}
          if: ${{ env.super_secret == '' }}
          run: 'echo "echo the repository secret \"AZURE_WEBAPP_NAME\" has not been made; echo please go to \"settings \> Actions secrets and variables \> actions\" to create it"; exit 1;'
    
        - name: "Check if WEBAPI_PROJECT_FOLDER secret exists"
          env: 
            super_secret: ${{ secrets.WEBAPI_PROJECT_FOLDER }}
          if: ${{ env.super_secret == '' }}
          run: 'echo "echo the repository secret \"WEBAPI_PROJECT_FOLDER\" has not been made; echo please go to \"settings \> Actions secrets and variables \> actions\" to create it"; exit 1;'
        
        - name: "Check if AZURE_WEBAPP_PUBLISH_PROFILE secret exists"
          env: 
            super_secret: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE}}
          if: ${{ env.super_secret == '' }}
          run: 'echo "echo the repository secret \"AZURE_WEBAPP_PUBLISH_PROFILE\" has not been made; echo please go to \"settings \> Actions secrets and variables \> actions\" to create it"; exit 1;'
        

  build:

    runs-on: ubuntu-latest
    needs: check
    steps:
    
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{env.DOTNET_CORE_VERSION}}

    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --no-restore
    
    - name: Test
      run: dotnet test --no-build --verbosity normal
    
    - name: Publish
      run: dotnet publish ./${{ secrets.WEBAPI_PROJECT_FOLDER }} --output ${{env.PUBLISH_DIRECTORY}} --configuration Release 
    
    - name: Publish Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: ${{ env.PUBLISH_DIRECTORY}}

  deploy:
    runs-on: ubuntu-latest
    needs: [check, build]
    steps:

    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: ${{ env.PUBLISH_DIRECTORY}}

     # Deploy to Azure Web apps
    - name: 'Deploy to Azure App Service'
      uses: azure/webapps-deploy@v3
      with: 
        app-name: ${{ secrets.AZURE_WEBAPP_NAME }} # Replace with your app name
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: '${{ env.PUBLISH_DIRECTORY}}'
        clean: true